apiVersion: v1
kind: Pod
metadata:
  name: mi50-pytorch-shell
spec:
  activeDeadlineSeconds: 1200
  containers:
    - name: mi50-pytorch
      image: rocm/pytorch:rocm6.3.4_ubuntu24.04_py3.12_pytorch_release_2.4.0
      env:
        - name: HIP_VISIBLE_DEVICES
          value: "0" # 0,1,2,...,n for running on GPU and select the GPUs, -1 for running on CPU
      resources:
        limits:
          amd.com/gpu: 1 # or whatever resource name your gpu plugin uses
      command: ["sleep", "infinity"]
      tty: true
      stdin: true
  restartPolicy: Never
